[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opdm-fastapi-template"
version = "0.1.0"
description = "OPDM FastAPI 服务（基于 opdm_fastapi_template）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    "opdm-lib",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pyright>=1.1.411",
]
prod = [
    "aioodbc>=0.5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["E402"]

[tool.uv.sources]
opdm-lib = { path = "../opdm_lib", editable = true }